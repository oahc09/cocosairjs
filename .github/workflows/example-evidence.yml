name: Full example evidence (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Record original job budget before checkout or installation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/committed-example-campaign"
          date +%s > "$RUNNER_TEMP/committed-example-campaign/job-started-epoch.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record exact committed candidate before dependency preparation
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/committed-example-campaign"
          git rev-parse HEAD > "$RUNNER_TEMP/committed-example-campaign/commit.txt"
          git ls-files -z build | xargs -0 sha256sum > "$RUNNER_TEMP/committed-example-campaign/committed-build.sha256"
          sha256sum src/air/spark/generated/spark-runtime.js src/air/spark/generated/spark-runtime.js.map src/air/spark/generated/spark-runtime.d.ts > "$RUNNER_TEMP/committed-example-campaign/committed-spark-tree.sha256"
      - name: Hydrate dependencies without rebuilding committed artifacts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node tools/build/prepare-package.cjs
          # Restore only the ignored generator receipt, rejecting any generated-source byte change.
          node tools/build/spark-runtime-tree.cjs
          sha256sum --check "$RUNNER_TEMP/committed-example-campaign/committed-spark-tree.sha256"
          git diff --exit-code -- src/air/spark/generated
          sha256sum --check "$RUNNER_TEMP/committed-example-campaign/committed-build.sha256"
          git diff --exit-code -- build tools/build/build-number.json package.json package-lock.json
      - name: Validate collector CPU contracts
        run: |
          set -euo pipefail
          npx prettier --check tools/verify/example-asset-lifecycle.test.cjs examples/shared/asset-lifecycle.js examples/glass-refraction/src/main.ts examples/gltf-viewer/main.js tools/verify/example-evidence-shutdown-policy.cjs tools/verify/example-evidence-shutdown-policy.test.cjs .github/workflows/example-shutdown-diagnostic.yml tools/verify/example-evidence-shutdown-trace.cjs tools/verify/example-evidence-shutdown-trace.test.cjs tools/verify/run-example-shutdown-target.cjs test/smoke/smoke-example-evidence-integration.test.ts tools/verify/example-evidence-process-diagnostics.cjs tools/verify/example-evidence-process-diagnostics.test.cjs tools/verify/example-evidence-supervisor.cjs tools/verify/example-evidence-supervisor.test.cjs .github/workflows/example-evidence.yml .github/workflows/format.yml docs/reference/example-evidence-campaign.md
          EXAMPLE_EVIDENCE_CPU_OUT="$RUNNER_TEMP/example-evidence-cpu" node tools/verify/example-evidence-supervisor.test.cjs 2>&1 | tee "$RUNNER_TEMP/committed-example-campaign/supervisor-tests.log"
          EXAMPLE_SHUTDOWN_CPU_OUT="$RUNNER_TEMP/example-evidence-cpu/shutdown-policy" node --test tools/verify/example-evidence-shutdown-policy.test.cjs
          node --test tools/verify/shaders-holographic-rotation.test.cjs 2>&1 | tee "$RUNNER_TEMP/committed-example-campaign/rotation-tests.log"
          node --test tools/verify/example-asset-lifecycle.test.cjs 2>&1 | tee "$RUNNER_TEMP/committed-example-campaign/asset-lifecycle-tests.log"
          node --test tools/verify/example-evidence-process-diagnostics.test.cjs 2>&1 | tee "$RUNNER_TEMP/committed-example-campaign/process-diagnostics-tests.log"
          npx jest --runInBand --no-cache --runTestsByPath test/smoke/smoke-example-workspace.test.ts test/smoke/smoke-example-evidence-campaign.test.ts test/smoke/smoke-example-evidence-publication.test.ts test/smoke/smoke-example-evidence-integration.test.ts test/smoke/smoke-example-specialized-probes.test.ts test/smoke/smoke-example-driver-pixel-diagnostics.test.ts 2>&1 | tee "$RUNNER_TEMP/committed-example-campaign/focused-tests.log"
          node tools/verify/example-evidence-preflight.cjs > "$RUNNER_TEMP/committed-example-campaign/preflight.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-evidence-cpu-receipts
          path: ${{ runner.temp }}/example-evidence-cpu/
          if-no-files-found: ignore
      - name: Prepare official Chromium and audio dependencies
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/air-browser-tools" --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/air-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/air-browser-tools/node_modules" >> "$GITHUB_ENV"
          sudo apt-get install -y libgl1-mesa-dri pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl info
          python3 --version
          sha256sum --check "$RUNNER_TEMP/committed-example-campaign/committed-build.sha256"
          git diff --exit-code -- build tools/build/build-number.json package.json package-lock.json
      - name: Capture three pilots then the exact remaining frozen scope
        run: |
          set -euo pipefail
          campaign="$RUNNER_TEMP/committed-example-campaign"
          node tools/verify/example-evidence-preflight.cjs > "$campaign/preflight-before-freeze.json"
          node tools/verify/example-evidence-campaign.cjs freeze --out="$campaign/freeze.json"
          node - "$campaign" <<'NODE'
          const fs = require('fs'), path = require('path'), root = process.argv[2];
          const freeze = JSON.parse(fs.readFileSync(path.join(root, 'freeze.json')));
          const pilots = ['html-texture-experimental', 'shader-driver-pilot', 'spark-splats'];
          if (pilots.some(id => !freeze.scope.some(entry => entry.id === id))) throw Error('Missing fixed pilot');
          const ids = [...pilots, ...freeze.scope.map(entry => entry.id).filter(id => !pilots.includes(id))];
          if (new Set(ids).size !== freeze.scope.length || ids.length !== freeze.scope.length) throw Error('Invalid full scope');
          fs.writeFileSync(path.join(root, 'ids.txt'), ids.join('\n') + '\n', {flag: 'wx'});
          NODE
          # Every ID is a new physical worker with its own 15s startup, 4s close,
          # and 120/125/133/139s inner/abort/force/final deadlines. The external
          # 174s TERM /178s KILL is a final fail-closed bound, never a PASS receipt.
          # Leave 180s before the campaign budget ends; never cut across attempts.
          capture_deadline=$(( $(date +%s) + 4800 ))
          job_deadline=$(( $(cat "$campaign/job-started-epoch.txt") + 4800 ))
          campaign_deadline=$(( capture_deadline < job_deadline ? capture_deadline : job_deadline ))
          index=0
          while IFS= read -r id; do
            if [ "$(( $(date +%s) + 180 ))" -gt "$campaign_deadline" ]; then
              echo 'Campaign budget exhausted; retaining partial results.' >&2
              exit 124
            fi
            index=$((index + 1))
            attempt_start=$(date +%s)
            timeout --signal=TERM --kill-after=4s 174s node tools/verify/run-example-evidence-campaign.cjs --freeze="$campaign/freeze.json" --id="$id" --out="$campaign/attempts/$id/1" --execute-authorized 2>&1 | tee "$campaign/invocation-$index.log"
            printf '%s\t%s\t%s\n' "$index" "$id" "$(( $(date +%s) - attempt_start ))" >> "$campaign/attempt-elapsed.tsv"
            if [ "$index" -eq 3 ]; then
              echo 'All three pilot attempts admitted with physical closure; continuing frozen remainder.'
              cat "$campaign/attempt-elapsed.tsv"
            fi
          done < "$campaign/ids.txt"
          sha256sum --check "$campaign/committed-build.sha256"
          segments=$(node -e 'const fs=require("fs"),p=require("path");const d=process.argv[1];process.stdout.write(fs.readdirSync(d).filter(x=>x.endsWith(".json")).sort().map(x=>p.join(d,x)).join(","))' "$campaign/segments")
          node tools/verify/example-evidence-campaign.cjs merge --freeze="$campaign/freeze.json" --segments="$segments" --out="$campaign/merged.json"
          node tools/verify/example-evidence-campaign.cjs check --evidence="$campaign/merged.json"
      - name: Publish only the strictly complete candidate in the disposable checkout
        id: publish
        run: |
          set -euo pipefail
          campaign="$RUNNER_TEMP/committed-example-campaign"
          node tools/verify/publish-example-evidence.cjs --campaign="$campaign/merged.json" --source-dir="$campaign"
          node tools/verify/example-evidence-campaign.cjs check
          npm run verify:example-chain
          git diff --binary -- examples > "$campaign/promotion-delta.patch"
          sha256sum --check "$campaign/committed-build.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-example-campaign-raw
          path: ${{ runner.temp }}/committed-example-campaign/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.publish.outcome == 'success'
        with:
          name: committed-example-campaign-publication
          path: |
            docs/evidence/examples-verified.json
            docs/evidence/example-campaigns/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: committed-example-publication-interruption
          include-hidden-files: true
          path: |
            docs/evidence/.examples-publication-incomplete.json
            .example-publication-stage-*/
          if-no-files-found: ignore
    env:
      AIR_CI_SOFTWARE_GL: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"

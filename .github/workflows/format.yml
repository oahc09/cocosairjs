name: Code quality

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cocos/cocos4
          ref: 557b06f7e636572a15a426eb8c2387f40b92798a
          path: _upstream
      - run: echo '_upstream/' >> .git/info/exclude
      - uses: actions/checkout@v4
        with:
          repository: shader-effects-inc/shaders
          ref: dbfd42abe341e7a6ea0b8ea1f5bab018b8e8439a
          path: output/shaders-absorption/reference
      - uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/MaterialX
          ref: 7b64921ef1d42f2d57871e9d2c43dc11f041f26b
          path: output/shaders-absorption/materialx-source
          sparse-checkout: |
            libraries/stdlib/genglsl/lib/mx_noise.glsl
            LICENSE
          sparse-checkout-cone-mode: false
      - run: node tools/ci/prepare-shader-reference.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check committed complete example evidence before rebuilding
        run: |
          node tools/build/prepare-package.cjs
          sha256sum src/air/spark/generated/spark-runtime.js src/air/spark/generated/spark-runtime.js.map src/air/spark/generated/spark-runtime.d.ts > "$RUNNER_TEMP/committed-spark-tree.sha256"
          node tools/build/spark-runtime-tree.cjs
          sha256sum --check "$RUNNER_TEMP/committed-spark-tree.sha256"
          git diff --exit-code -- src/air/spark/generated
          node tools/verify/example-evidence-supervisor.test.cjs
          npx jest --runInBand --no-cache --runTestsByPath test/smoke/smoke-example-workspace.test.ts test/smoke/smoke-example-evidence-campaign.test.ts test/smoke/smoke-example-evidence-publication.test.ts test/smoke/smoke-example-evidence-integration.test.ts
          node tools/verify/example-evidence-preflight.cjs
          node tools/verify/example-evidence-campaign.cjs check
      - run: npm run format:check
      - run: npx prettier --check tools/verify/release-readiness.cjs tools/examples/api-inventory.cjs tools/examples/reconcile-api-claims.cjs tools/examples/coverage-bindings/bind-vector-instance.cjs tools/examples/coverage-bindings/bind-tween-control.cjs tools/examples/coverage-bindings/bind-animation-runtime.cjs tools/examples/coverage-bindings/bind-widget-layout.cjs
      - run: npx prettier --check "tools/verify/example-evidence*.cjs" tools/verify/example-workspace.cjs tools/verify/run-example-evidence-campaign.cjs tools/verify/publish-example-evidence.cjs "test/smoke/smoke-example-*.test.ts" AGENTS.md tools/README.md docs/reference/example-evidence-campaign.md docs/reference/verification.md
      - run: npm run typecheck
      - name: Build runtime and declarations
        run: |
          node -e 'const os = require("node:os"); const v8 = require("node:v8"); console.log(JSON.stringify({buildResources: {totalBytes: os.totalmem(), freeBytes: os.freemem(), constrainedBytes: process.constrainedMemory(), availableBytes: process.availableMemory(), heapLimitBytes: v8.getHeapStatistics().heap_size_limit, parallelism: os.availableParallelism()}}))'
          ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,12p'
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v npm run build:all
          else
            npm run build:all
          fi
          npm run build:spark
        env:
          # Preserve full JS/map generation; its measured working set exceeds Node's default 2 GiB heap.
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run gallery:api
      - run: git diff --exit-code -- docs/example-api-inventory.json
      - run: npm run verify:doc-refs
      - name: Prepare browser evidence tooling
        run: |
          sha256sum node_modules/typescript/package.json node_modules/@types/node/package.json > "$RUNNER_TEMP/air-type-dependencies.sha256"
          npm install --prefix "$RUNNER_TEMP/air-browser-tools" --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/air-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
          echo "NODE_PATH=$RUNNER_TEMP/air-browser-tools/node_modules" >> "$GITHUB_ENV"
          sha256sum --check "$RUNNER_TEMP/air-type-dependencies.sha256"
          sudo apt-get install -y libgl1-mesa-dri xvfb pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl info
          node tools/verify/static-file-response.cjs
      - name: Diagnose runner browser prerequisites
        run: xvfb-run --auto-servernum npm run verify:browser-matrix -- --ids=profiler-overlay,point-cloud-basics,audio-basic,video-basic --out=output/ci-browser-diagnostic.json
      - name: Collect current full browser matrix
        run: |
          xvfb-run --auto-servernum npm run verify:browser-matrix -- --out=output/ci-browser-matrix.json
          cp output/ci-browser-matrix.json docs/evidence/browser-matrix/browser-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-matrix-diagnostics
          path: |
            output/ci-browser-diagnostic.json
            output/ci-browser-matrix.json
          if-no-files-found: ignore
      - name: Collect bounded DOM audio cancellation regression
        run: xvfb-run --auto-servernum node tools/verify/audio-cancellation/supervise.cjs
        env:
          REVIEW_TAG: ci-dom-audio
          FULL: "0"
          AUDIO_QA_OUT: output/ci-audio-cancellation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dom-audio-cancellation-diagnostics
          path: output/ci-audio-cancellation/
          if-no-files-found: ignore
      - name: Collect current fixed-snapshot example campaign
        run: |
          set -euo pipefail
          campaign="$RUNNER_TEMP/current-example-campaign"
          mkdir "$campaign"
          node tools/verify/example-evidence-preflight.cjs > "$campaign/preflight.json"
          node tools/verify/example-evidence-campaign.cjs freeze --out="$campaign/freeze.json"
          node -e 'const f=require(process.argv[1]); process.stdout.write(f.scope.map(e=>e.id).join("\n")+"\n")' "$campaign/freeze.json" > "$campaign/ids.txt"
          # Each invocation has its own external 139s deadline, 15s startup and 4s close.
          # Stop on failure; originals are uploaded. No unbounded shared browser or automatic retry.
          while IFS= read -r id; do
            xvfb-run --auto-servernum node tools/verify/run-example-evidence-campaign.cjs --freeze="$campaign/freeze.json" --id="$id" --out="$campaign/attempts/$id/1" --execute-authorized
          done < "$campaign/ids.txt"
          segments=$(node -e 'const fs=require("fs"),p=require("path");const d=process.argv[1];process.stdout.write(fs.readdirSync(d).filter(x=>x.endsWith(".json")).sort().map(x=>p.join(d,x)).join(","))' "$campaign/segments")
          node tools/verify/example-evidence-campaign.cjs merge --freeze="$campaign/freeze.json" --segments="$segments" --out="$campaign/merged.json"
          node tools/verify/publish-example-evidence.cjs --campaign="$campaign/merged.json" --source-dir="$campaign"
          node tools/verify/example-evidence-campaign.cjs check
          npm run verify:example-chain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-snapshot-example-campaign
          path: ${{ runner.temp }}/current-example-campaign/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-example-evidence
          path: |
            docs/evidence/examples-verified.json
            docs/evidence/example-campaigns/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: example-publication-interruption
          include-hidden-files: true
          path: |
            docs/evidence/.examples-publication-incomplete.json
            .example-publication-stage-*/
          if-no-files-found: ignore
      - name: Run Jest and verify test discovery
        run: npm run verify:test-inventory
      - run: npm run verify:consumer
      - run: npm run verify:web-only
      - run: npm run verify:licenses
      - run: npm run verify:decoders
      - run: npm run verify:benchmark
      - run: npm run verify:file-map
      - run: npm run verify:wasm-backends
      - run: npm run verify:feature-exports
      - run: npm run verify:custom-exports
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/examples/coverage-report.cjs --check
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm run verify:release
    env:
      COCOS_UPSTREAM: ${{ github.workspace }}/_upstream
      AIR_CI_SOFTWARE_GL: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"

name: Code quality

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cocos/cocos4
          ref: 557b06f7e636572a15a426eb8c2387f40b92798a
          path: _upstream
      - run: echo '_upstream/' >> .git/info/exclude
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npx prettier --check tools/verify/release-readiness.cjs tools/examples/api-inventory-v2.cjs tools/examples/reconcile-api-claims.cjs tools/examples/add-vector-instance-coverage.cjs tools/examples/add-tween-control-coverage.cjs
      - run: npm run typecheck
      - run: npx jest --runInBand
      - run: npm run build:all
      - run: npm run gallery:api
      - run: git diff --exit-code -- docs/example-api-inventory.json
      - run: npm run verify:consumer
      - run: npm run verify:web-only
      - run: npm run verify:licenses
      - run: npm run verify:decoders
      - run: npm run verify:test-inventory
      - run: npm run verify:benchmark
      - run: npm run verify:file-map
      - run: npm run verify:v12-backends
      - run: npm run verify:v12-feature-face
      - run: npm run verify:v12-custom-face
      - run: npm run verify:doc-refs
      - run: npm run verify:v11-chain-face
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/examples/coverage-report.cjs --check
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm run verify:release
    env:
      COCOS_UPSTREAM: ${{ github.workspace }}/_upstream

name: Code quality

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AIR_CI_SOFTWARE_GL: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Record core job budget
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-example-smoke" "$RUNNER_TEMP/core-cpu"
          date +%s > "$RUNNER_TEMP/core-example-smoke/job-started-epoch.txt"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and verify generated source consistency
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node tools/build/prepare-package.cjs
          sha256sum src/air/spark/generated/spark-runtime.js src/air/spark/generated/spark-runtime.js.map src/air/spark/generated/spark-runtime.d.ts > "$RUNNER_TEMP/committed-spark-tree.sha256"
          node tools/build/spark-runtime-tree.cjs
          sha256sum --check "$RUNNER_TEMP/committed-spark-tree.sha256"
          git diff --exit-code -- src/air/spark/generated
      - name: Check formatting and types
        run: |
          set -euo pipefail
          npm run format:check
          npx prettier --check tools/verify/example-asset-lifecycle.test.cjs tools/verify/runtime-readback.cjs tools/verify/example-spec-browser.cjs tools/verify/example-evidence-campaign.cjs tools/verify/example-evidence-shutdown-policy.cjs tools/verify/example-evidence-shutdown-policy.test.cjs tools/verify/shaders-holographic-rotation.test.cjs test/smoke/smoke-example-evidence-integration.test.ts .github/workflows/example-evidence.yml AGENTS.md tools/README.md docs/reference/verification.md docs/reference/example-evidence-campaign.md
          npm run typecheck
      - name: Build runtime, source maps and declarations
        run: |
          set -euo pipefail
          npm run build:all
          npm run build:spark
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Record exact-head runtime build
        run: |
          set -euo pipefail
          node tools/verify/runtime-build-receipt.cjs
      - name: Retain runtime build for reviewed artifact commit
        uses: actions/upload-artifact@v4
        with:
          name: audit-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          path: |
            build/cocosair.module.js
            build/cocosair.module.js.map
            build/cocosair.module.min.js
            build/cocosair.module.min.js.map
            build/cocosair.module.d.ts
            build/cocosair.legacy.d.ts
            tools/build/build-number.json
            output/audit-runtime/provenance.json
          if-no-files-found: error
      - name: Run focused core regressions
        run: |
          set -euo pipefail
          node --test tools/verify/shaders-holographic-rotation.test.cjs 2>&1 | tee "$RUNNER_TEMP/core-cpu/rotation.log"
          node --test tools/verify/example-asset-lifecycle.test.cjs 2>&1 | tee "$RUNNER_TEMP/core-cpu/asset-lifecycle.log"
          node --test tools/verify/example-evidence-status.test.cjs 2>&1 | tee "$RUNNER_TEMP/core-cpu/status-admission.log"
          EXAMPLE_SHUTDOWN_CPU_OUT="$RUNNER_TEMP/core-cpu/shutdown-policy" node --test tools/verify/example-evidence-shutdown-policy.test.cjs 2>&1 | tee "$RUNNER_TEMP/core-cpu/shutdown-policy.log"
          npx jest --runInBand --no-cache --runTestsByPath test/smoke/webgl2-state-audit.test.ts test/smoke/webgl2-gfx-command-contracts.test.ts test/smoke/smoke-01-bootstrap.test.ts test/smoke/smoke-02-scene.test.ts test/smoke/smoke-03-runtime-asset.test.ts test/smoke/audio-cancellation.test.ts test/smoke/audio-readiness.test.ts test/smoke/dynamic-atlas-ownership.test.ts test/smoke/audio-cancellation-harness.test.ts test/smoke/smoke-example-evidence-integration.test.ts 2>&1 | tee "$RUNNER_TEMP/core-cpu/unit-tests.log"
      - name: Prepare Chromium for five core examples
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/air-browser-tools" --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/air-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/air-browser-tools/node_modules" >> "$GITHUB_ENV"
      - name: Verify five core examples with bounded real browsers
        run: |
          set -euo pipefail
          campaign="$RUNNER_TEMP/core-example-smoke"
          node tools/verify/example-evidence-preflight.cjs > "$campaign/preflight.json"
          node tools/verify/example-evidence-campaign.cjs freeze --out="$campaign/freeze.json"
          # This is a fixed core subset, not a full campaign or publication.
          for id in shader-driver-pilot glass-refraction gltf-viewer input spark-splats; do
            if [ "$(( $(date +%s) + 180 ))" -gt "$(( $(cat "$campaign/job-started-epoch.txt") + 1800 ))" ]; then
              echo 'Core smoke budget exhausted; keeping partial originals.' >&2
              exit 124
            fi
            timeout --signal=TERM --kill-after=4s 174s node tools/verify/run-example-evidence-campaign.cjs --freeze="$campaign/freeze.json" --id="$id" --out="$campaign/attempts/$id/1" --execute-authorized 2>&1 | tee "$campaign/$id.log"
          done
          echo 'Five core examples passed. This is partial smoke coverage; no full campaign was published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain core test and browser originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-quality-results
          path: |
            ${{ runner.temp }}/core-cpu/
            ${{ runner.temp }}/core-example-smoke/
          if-no-files-found: error

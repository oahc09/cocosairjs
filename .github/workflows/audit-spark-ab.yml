name: Audit Spark A-B diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/audit-spark-ab.yml
      - tools/verify/spark-startup-diagnostic.cjs

permissions:
  contents: read

jobs:
  spark-ab:
    if: github.repository == 'oahc09/cocosairjs' && github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIR_CI_SOFTWARE_GL: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare identical browser and frozen inputs
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node tools/build/prepare-package.cjs
          npm install --prefix "$RUNNER_TEMP/air-browser-tools" --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/air-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/air-browser-tools/node_modules" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/spark-ab-inputs" "$RUNNER_TEMP/spark-ab-results"
          cp build/cocosair.module.js "$RUNNER_TEMP/spark-ab-inputs/candidate.js"
          cp build/cocosair.module.min.js "$RUNNER_TEMP/spark-ab-inputs/candidate.min.js"
          git show bac30c0f9b9e9cb61e43720d23053a98d24ac811:build/cocosair.module.js > "$RUNNER_TEMP/spark-ab-inputs/baseline.js"
          git show bac30c0f9b9e9cb61e43720d23053a98d24ac811:build/cocosair.module.min.js > "$RUNNER_TEMP/spark-ab-inputs/baseline.min.js"
          test "$(git hash-object "$RUNNER_TEMP/spark-ab-inputs/baseline.js")" = debd136ea9899d06d80d4a761c8e396ccd4864d5
          test "$(git hash-object "$RUNNER_TEMP/spark-ab-inputs/candidate.js")" = 96cfa03d3ffe9e5036fed28f1477e80e388378ce
          test "$(git hash-object build/spark.module.js)" = 57acc480358690372e0d96ef55062c9cb752458f
          git rev-parse HEAD > "$RUNNER_TEMP/spark-ab-results/diagnostic-head.txt"
          printf '%s\n' 'baseline-source=bac30c0f9b9e9cb61e43720d23053a98d24ac811' 'candidate-runtime-source=005ebaccf7c56acf2d3f7c99731b2d60020c9f30' > "$RUNNER_TEMP/spark-ab-results/source-heads.txt"
          sha256sum "$RUNNER_TEMP/spark-ab-inputs/"* build/spark.module.js examples/spark-splats/src/main.ts tools/benchmark/runner/browser-runtime.cjs tools/verify/example-evidence-observer.cjs tools/verify/spark-startup-diagnostic.cjs > "$RUNNER_TEMP/spark-ab-results/input-sha256.txt"
      - name: Run bounded Spark baseline and candidate on the same runner
        run: |
          set -euo pipefail
          failed=0
          for variant in baseline candidate; do
            cp "$RUNNER_TEMP/spark-ab-inputs/$variant.js" build/cocosair.module.js
            cp "$RUNNER_TEMP/spark-ab-inputs/$variant.min.js" build/cocosair.module.min.js
            out="$RUNNER_TEMP/spark-ab-results/$variant"
            mkdir -p "$out"
            node tools/verify/example-evidence-campaign.cjs freeze --out="$out/freeze.json"
            if AIR_SPARK_AB_DIAGNOSTIC=1 AIR_SPARK_AB_VARIANT="$variant" NODE_OPTIONS="--require=$PWD/tools/verify/spark-startup-diagnostic.cjs" timeout --signal=TERM --kill-after=4s 174s node tools/verify/run-example-evidence-campaign.cjs --freeze="$out/freeze.json" --id=spark-splats --out="$out/attempts/spark-splats/1" --execute-authorized > "$out/invocation.log" 2>&1; then
              code=0
            else
              code=$?
              failed=1
            fi
            printf '%s\n' "$code" > "$out/exit-code.txt"
            cat "$out/invocation.log"
          done
          cp "$RUNNER_TEMP/spark-ab-inputs/candidate.js" build/cocosair.module.js
          cp "$RUNNER_TEMP/spark-ab-inputs/candidate.min.js" build/cocosair.module.min.js
          test "$failed" = 0
      - name: Preserve diagnostic originals only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-spark-ab-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/spark-ab-results/
          retention-days: 7
          if-no-files-found: error

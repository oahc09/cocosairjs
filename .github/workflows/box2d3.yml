name: Box2D acceptance
"on":
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: box2d-acceptance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Check Box2D CI selection policy
        run: node --test tools/ci/box2d-scope.test.cjs tools/verify/box2d3-presentation.test.cjs
      - name: Select acceptance from complete Git diff
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: node tools/ci/box2d-scope.cjs
  acceptance:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      AIR_CI_SOFTWARE_GL: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install frozen project and browser dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/air-box2d-tools" --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/air-box2d-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
          echo "NODE_PATH=$RUNNER_TEMP/air-box2d-tools/node_modules" >> "$GITHUB_ENV"
      - name: Build one candidate and its actual tarball
        run: |
          set -euo pipefail
          mkdir -p output/box2d/ci/package
          node tools/build/box2d3.cjs --check 2>&1 | tee output/box2d/ci/source-check.log
          node tools/verify/box2d3-native.mjs 2>&1 | tee output/box2d/ci/native-regressions.log
          node --test tools/verify/box2d3-adapter.test.cjs 2>&1 | tee output/box2d/ci/adapter-regressions.log
          npm run build:all 2>&1 | tee output/box2d/ci/build.log
          cp build/cocosair.module.js output/box2d/ci/cocosair.module.js
          npm pack --json --pack-destination output/box2d/ci/package > output/box2d/ci/package/pack.json
      - name: Run complete official and AIR acceptance on three engines
        run: |
          set -euo pipefail
          for engine in chromium firefox webkit; do
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node tools/verify/box2d3.cjs --engine="$engine" --scope=all 2>&1 | tee "output/box2d/ci/$engine.log"
            else
              node tools/verify/box2d3.cjs --engine="$engine" --scope=all 2>&1 | tee "output/box2d/ci/$engine.log"
            fi
          done
      - name: Verify both installed tarball runtimes in a real browser
        run: |
          set -euo pipefail
          tarball="output/box2d/ci/package/$(node -p 'JSON.parse(require("fs").readFileSync("output/box2d/ci/package/pack.json"))[0].filename')"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node tools/verify/box2d3-package.cjs --tarball="$tarball" --out=output/box2d/ci/package-browser
          else
            node tools/verify/box2d3-package.cjs --tarball="$tarball" --out=output/box2d/ci/package-browser
          fi
      - name: Retain all reports, screenshots, observations, failed attempts and tarball
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: box2d-${{ matrix.os }}-${{ github.sha }}
          path: output/box2d/
          if-no-files-found: error

<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="icon" href="data:," />
        <title>Cocos AIR · MRT 附件</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: #101820;
                color: #d9eef3;
                font:
                    15px system-ui,
                    sans-serif;
            }
            main {
                max-width: 1040px;
                margin: 40px auto;
                padding: 0 24px;
            }
            h1 {
                margin-bottom: 8px;
            }
            p {
                color: #99b5bf;
                line-height: 1.7;
            }
            #stage {
                width: min(100%, 560px);
                aspect-ratio: 1;
                background: #03080c;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            .controls {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 12px;
                margin: 20px 0;
            }
            button,
            select {
                background: #21343f;
                color: inherit;
                border: 1px solid #56717c;
                padding: 8px 12px;
                font: inherit;
            }
            button:disabled,
            select:disabled {
                opacity: 0.4;
            }
            pre {
                white-space: pre-wrap;
                color: #a4dfd6;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>MRT · 三路原生附件</h1>
            <p>RGBA16F 颜色、RG16F 速度、R32UI 对象 ID。叠加仅写颜色，速度与精确整数 ID 保持。</p>
            <div class="controls">
                <label
                    >查看
                    <select id="channel">
                        <option value="0">颜色</option>
                        <option value="1">速度</option>
                        <option value="2">整数 ID</option>
                    </select></label
                >
                <label><input id="overlay" type="checkbox" /> 仅颜色透明叠加</label>
                <button id="resize">切换 64 / 128</button>
                <button id="dispose">释放资源</button>
                <button id="rebuild">重新创建</button>
            </div>
            <div id="stage"><canvas id="GameCanvas"></canvas></div>
            <pre id="status" aria-live="polite">BOOTING</pre>
            <p>
                独立开发探针，不进入默认 runtime。显示直接采样三个 GPU 附件；整数未经过 Float32 中转。ID
                使用独立单采样目标。
            </p>
        </main>
        <script type="module" src="./main.js"></script>
    </body>
</html>

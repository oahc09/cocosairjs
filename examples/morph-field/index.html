<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FORM / MATTER · Cocos AIR</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: system-ui, sans-serif;
            }
            html,
            body,
            #GameDiv,
            #Cocos3dGameContainer,
            canvas {
                margin: 0;
                width: 100%;
                height: 100%;
                display: block;
                overflow: hidden;
                background: #050a12;
            }
            header {
                position: fixed;
                top: 28px;
                left: 32px;
                pointer-events: none;
            }
            small {
                color: #83bfc9;
                letter-spacing: 0.22em;
                font-size: 10px;
            }
            h1 {
                font-size: clamp(22px, 3vw, 34px);
                margin: 5px 0;
                font-weight: 500;
                letter-spacing: -0.04em;
                color: #f5e8cd;
            }
            header p {
                color: #89a0b5;
                font-size: 12px;
                margin: 6px 0;
            }
            aside {
                position: fixed;
                left: 24px;
                right: 24px;
                bottom: 22px;
                max-width: 880px;
                margin: auto;
                padding: 16px 20px;
                background: #0c1724ed;
                border: 1px solid #304052;
                border-radius: 12px;
            }
            .controls {
                display: flex;
                gap: 14px;
                align-items: center;
                flex-wrap: wrap;
                color: #adc2cf;
                font-size: 12px;
            }
            select,
            button {
                font: inherit;
                background: #192e40;
                color: #e4eced;
                border: 1px solid #3c5263;
                border-radius: 5px;
                padding: 5px 8px;
            }
            input[type='range'] {
                accent-color: #e8bf79;
                width: 160px;
                vertical-align: middle;
            }
            input[type='checkbox'] {
                accent-color: #e8bf79;
            }
            button:focus-visible,
            select:focus-visible,
            input:focus-visible {
                outline: 2px solid #e8bf79;
                outline-offset: 2px;
            }
            output {
                display: block;
                margin-top: 12px;
                color: #7896aa;
                font: 11px/1.5 monospace;
            }
            @media (max-width: 600px) {
                header {
                    top: 16px;
                    left: 20px;
                }
                aside {
                    left: 12px;
                    right: 12px;
                    bottom: 12px;
                    padding: 12px;
                }
                .controls {
                    gap: 8px;
                }
                input[type='range'] {
                    width: 110px;
                }
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <div id="GameDiv">
            <div id="Cocos3dGameContainer">
                <canvas id="GameCanvas" aria-label="可变形的文字、球体、圆环和图像点场"></canvas>
            </div>
        </div>
        <header>
            <small>COCOS AIR / GPU MORPH STUDY</small>
            <h1>FORM / MATTER</h1>
            <p>16,384 个样本 · 拖动旋转 · 形态在 GPU 中连续变化</p>
        </header>
        <aside>
            <div class="controls">
                <label
                    >从
                    <select id="from">
                        <option value="0">文字 AIR</option>
                        <option value="1">球体</option>
                        <option value="2">圆环</option>
                        <option value="3">图像</option>
                    </select></label
                >
                <label
                    >到
                    <select id="to">
                        <option value="0">文字 AIR</option>
                        <option value="1" selected>球体</option>
                        <option value="2">圆环</option>
                        <option value="3">图像</option>
                    </select></label
                >
                <label>进度 <input id="progress" type="range" min="0" max="1" step="0.001" value="0" /></label>
                <label
                    >图元
                    <select id="mode">
                        <option value="points">点</option>
                        <option value="voxels">体素</option>
                    </select></label
                >
                <label><input id="auto" type="checkbox" /> 自动往返</label>
                <label
                    >表面
                    <select id="surface">
                        <option value="polished">抛光金属</option>
                        <option value="unlit">原色</option>
                    </select></label
                >
                <label>粗糙度 <input id="roughness" type="range" min="0.04" max="1" step="0.01" value="0.18" /></label>
                <button id="pause">暂停</button>
            </div>
            <output id="status" role="status">正在采样字体与几何…</output>
        </aside>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>

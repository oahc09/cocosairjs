<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cocos AIR — glTF Animation Instances</title>
        <style>
            html,
            body,
            #GameDiv,
            #Cocos3dGameContainer {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #192132;
            }
            #GameCanvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            aside {
                position: absolute;
                top: 18px;
                left: 22px;
                color: #d9e7f5;
                font: 14px/1.6 system-ui;
            }
            h1 {
                font-size: 20px;
                margin: 0 0 6px;
            }
            select,
            button {
                margin-right: 8px;
                padding: 5px 8px;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <div id="GameDiv">
            <div id="Cocos3dGameContainer"><canvas id="GameCanvas"></canvas></div>
        </div>
        <aside>
            <h1>glTF instance contracts</h1>
            <div>Left: loop + private tint · Right: shared material + play once</div>
            <select id="clips" aria-label="Animation clip"></select
            ><button id="pause">Pause left</button><button id="resume">Resume left</button>
            <div id="status">Loading local model…</div>
        </aside>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>

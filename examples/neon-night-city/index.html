<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cocos AIR — Neon night city</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #0e1628;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            nav {
                position: fixed;
                left: 16px;
                bottom: 16px;
                display: flex;
                gap: 8px;
            }
            button {
                padding: 9px 14px;
                background: #243755;
                color: #eff6ff;
                border: 1px solid #677fa0;
                cursor: pointer;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <canvas id="GameCanvas"></canvas>
        <nav><button data-ui="toggle-fog">Toggle fog</button><button data-ui="reset">Reset</button></nav>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>

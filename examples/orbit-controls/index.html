<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cocos AIR — Orbit Controls</title>
        <style>
            html,
            body,
            #GameDiv,
            #Cocos3dGameContainer {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #161d2b;
            }
            #GameCanvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
            }
            aside {
                position: absolute;
                top: 20px;
                left: 24px;
                color: #d8e5f3;
                font: 14px/1.6 system-ui;
                pointer-events: none;
            }
            h1 {
                margin: 0;
                font-size: 20px;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <div id="GameDiv">
            <div id="Cocos3dGameContainer"><canvas id="GameCanvas"></canvas></div>
        </div>
        <aside>
            <h1>Orbit Controls</h1>
            <div>Drag to orbit · wheel to zoom · release to coast</div>
            <div id="status"></div>
        </aside>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>

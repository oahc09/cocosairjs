<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="data:," />
        <title>cocosair — video-basic (LV12-04)</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #fff;
            }
            #GameDiv {
                width: 100%;
                height: 100%;
            }
            #Cocos3dGameContainer {
                width: 100%;
                height: 100%;
            }
            #GameCanvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #start-demo {
                position: fixed;
                left: 12px;
                top: 12px;
                z-index: 10;
                padding: 10px 16px;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <div id="GameDiv">
            <div id="Cocos3dGameContainer">
                <canvas id="GameCanvas"></canvas>
            </div>
        </div>
        <button id="start-demo" hidden>Play video</button>
        <script type="module" src="./main.js"></script>
    </body>
</html>

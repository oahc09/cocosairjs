<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Starfield Galaxy · Cocos AIR</title>
        <style>
            html,
            body,
            #GameDiv,
            #Cocos3dGameContainer {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #02050d;
            }
            #GameCanvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            header {
                position: fixed;
                top: 28px;
                left: 32px;
                color: #d8e8f0;
                pointer-events: none;
            }
            header p,
            #hud {
                font:
                    12px/1.7 Consolas,
                    monospace;
                letter-spacing: 0.08em;
            }
            h1 {
                font:
                    normal 34px Georgia,
                    serif;
                margin: 6px 0;
            }
            #hud {
                position: fixed;
                bottom: 30px;
                left: 32px;
                color: #a4bed0;
                border-left: 1px solid #537287;
                padding-left: 16px;
            }
            button {
                color: #dbedf6;
                background: transparent;
                border: 1px solid #536678;
                padding: 9px 20px;
                font:
                    12px Consolas,
                    monospace;
                cursor: pointer;
                margin-top: 8px;
            }
            button:hover,
            button:focus-visible {
                background: #142537;
                outline: 1px solid #d8e8f0;
            }
            #status {
                position: fixed;
                right: 28px;
                bottom: 30px;
                color: #8199ab;
                font:
                    11px/1.7 Consolas,
                    monospace;
                text-align: right;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <div id="GameDiv">
            <div id="Cocos3dGameContainer"><canvas id="GameCanvas" aria-label="Interactive galaxy"></canvas></div>
        </div>
        <header>
            <p>DEEP SPACE OBSERVATORY / E01</p>
            <h1>A spiral of fifty thousand suns.</h1>
        </header>
        <div id="hud" aria-label="hud">
            <div id="readout">Preparing the galaxy…</div>
            <button type="button" aria-label="reset" data-bench="reset">Reset</button>
        </div>
        <aside id="status">
            MOVE · PARALLAX / SCROLL · CRUISE<br />Real render-loop frames/s, 2s window.<br />Not GPU timing or
            display-present measurement.
        </aside>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>

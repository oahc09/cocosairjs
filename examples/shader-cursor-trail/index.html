<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Cursor Trail 光标轨迹 · Cocos AIR</title>
        <link rel="icon" href="data:," />
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
            }
            canvas {
                touch-action: none;
                display: block;
                width: 100%;
                height: 100%;
            }
            aside {
                position: fixed;
                right: 10px;
                top: 10px;
                background: #101824e8;
                padding: 12px;
                color: white;
                font: 13px system-ui;
                max-height: 85vh;
                overflow: auto;
            }
            label {
                display: flex;
                justify-content: space-between;
                margin: 6px;
            }
            input {
                width: 110px;
            }
            button {
                margin: 3px;
            }
            .test aside {
                display: none;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <canvas id="GameCanvas"></canvas>
        <aside>
            <strong>E08 光标轨迹 · 原生胶囊链</strong>
            <div id="parameters"></div>
            <button id="pause">暂停</button><button id="resume">继续</button><button id="reset">重置</button
            ><button id="release">释放</button>
            <p id="status">单quad+64×1 rgba16f 纹理 · CPU anchors + live head</p>
        </aside>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>

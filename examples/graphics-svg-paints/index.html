<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Cocos AIR · Graphics · SVG 与富填充</title>
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="../shared/capability-lab.css" />
        <script type="importmap">
            {
                "imports": {
                    "cocosair": "/build/cocosair.module.js"
                }
            }
        </script>
    </head>
    <body>
        <header>
            <a href="/">COCOS AIR / EXAMPLES</a>
            <h1>Graphics · SVG 与富填充</h1>
            <p>原生绘图、渐变孔洞、纹理填充与 SVG 导出对照。</p>
        </header>
        <main>
            <div id="stage"><canvas id="GameCanvas"></canvas></div>
            <aside>
                <div class="controls">
                    <button id="solid">原生 Graphics</button><button id="gradient">渐变与孔洞</button
                    ><button id="pattern">纹理填充</button><button id="export">下载 SVG</button>
                </div>
                <img id="svg-preview" alt="同一绘图命令导出的 SVG" />
                <div class="controls"><button id="verify">运行断言</button><button id="dispose">释放资源</button></div>
                <output id="status" aria-live="polite">BOOTING</output>
                <pre id="results"></pre>
            </aside>
        </main>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>

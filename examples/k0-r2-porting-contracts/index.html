<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>cocosair — K0 R2 Porting Contracts</title>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                background: #0e1116;
                color: #dde2ea;
                font:
                    13px/1.5 system-ui,
                    sans-serif;
            }
            #GameCanvas {
                display: block;
                width: min(100vw, 640px);
                height: auto;
                aspect-ratio: 4 / 3;
            }
            #controls {
                position: fixed;
                left: 8px;
                right: 8px;
                bottom: 44px;
                z-index: 10;
                background: #111827ee;
                border-radius: 8px;
                padding: 10px 14px;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            #controls button {
                font: inherit;
                padding: 4px 12px;
                border: 1px solid #3a4252;
                border-radius: 4px;
                background: #1a1f29;
                color: #dde2ea;
                cursor: pointer;
            }
            #controls button:hover {
                background: #252c3a;
            }
            #controls button.active {
                border-color: #4a9eff;
                color: #7ab8ff;
            }
            #status {
                position: fixed;
                left: 8px;
                right: 8px;
                bottom: 4px;
                z-index: 10;
                background: #111827ee;
                padding: 4px 14px 10px;
                font-size: 11px;
                color: #8a93a5;
            }
        </style>
    </head>
    <body>
        <canvas id="GameCanvas" width="480" height="360"></canvas>
        <div id="controls">
            <button data-mode="vertex-color" title="N8: USE_VERTEX_COLOR + a_color">顶点色</button>
            <button data-mode="blend" title="N8: alpha/add 混合">混合</button>
            <button data-mode="dynamic-mesh" title="N3: 动态网格部分更新 + onGeometryChanged">动态网格</button>
            <button data-mode="billboard" title="N14: Billboard width/height">Billboard</button>
            <button id="btn-pause" title="暂停/恢复">暂停</button>
            <button id="btn-reset" title="重置当前模式">重置</button>
            <button id="btn-release" title="释放当前模式资源">释放</button>
        </div>
        <div id="status">加载中…</div>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>

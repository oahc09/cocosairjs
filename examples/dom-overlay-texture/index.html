<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Cocos AIR · DOM · 场景同步与纹理锚点</title>
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="../shared/capability-lab.css" />
        <script type="importmap">
            {
                "imports": {
                    "cocosair": "/build/cocosair.module.js",
                    "cocosair/bootstrap": "/build/bootstrap.js",
                    "cocosair/html-source": "/build/html-source.js"
                }
            }
        </script>
    </head>
    <body>
        <header>
            <a href="/">COCOS AIR / EXAMPLES</a>
            <h1>DOM · 场景同步与纹理锚点</h1>
            <p>真实输入与点击随原生节点变换；纹理锚点和 resize 独立更新。</p>
        </header>
        <main>
            <div id="stage"><canvas id="GameCanvas"></canvas></div>
            <aside>
                <div class="controls">
                    <button id="move">移动 / 旋转</button><button id="anchor">切换锚点</button
                    ><button id="resize">纹理 Resize</button><button id="restore">解绑再绑定</button>
                </div>
                <p>在画布里的输入框编辑文字并点击按钮，然后移动节点。四角纹理用于观察锚点变化。</p>
                <div class="controls"><button id="verify">运行断言</button><button id="dispose">释放资源</button></div>
                <output id="status" aria-live="polite">BOOTING</output>
                <pre id="results"></pre>
            </aside>
        </main>
        <div id="original">
            <div id="live-form" class="overlay-form">
                <input id="live-input" aria-label="场景输入" value="Editable DOM" /><button id="live-button">
                    Click DOM
                </button>
            </div>
            <span></span>
        </div>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
